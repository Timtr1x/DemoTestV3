# V3 benchmark suites (fix round v3.2 — P1 LLMail-only, strata, split-v2).
#
# Fix round vs v1:
#   - P1 is LLMail-only (AgentDojo P1 tool_result removed — environment content,
#     not attacker payload, leaked goal). P2 remains AgentDojo tool_call.
#   - Selection is per-stratum with explicit attack/benign quotas and cluster cap.
#   - Split is case-weighted group-aware (split-v2).
#   - Manifests are byte-identical: no created_at wall-clock field.
#   - Old v1 suites are preserved under benchmarks/manifests/*-v1 as superseded.
#
# A suite bundles projects into a named benchmark run. Suite identity is fixed
# once frozen: a new selection = a new suite version, never an in-place overwrite.

suites:

  smoke-v2:
    seed: 42
    split: dev
    split_version: split-v2
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/smoke-v2/p1.json
        target: 100
        strata:
          - id: llmail_attack
            dataset: llmail
            expected_action: block
            count: 80
          - id: llmail_benign
            dataset: llmail
            expected_action: allow
            count: all
        max_cluster_share: 0.01
      P2_tool_action:
        manifest: benchmarks/manifests/smoke-v2/p2.json
        target: 100
        strata:
          - id: agentdojo_tool_call
            dataset: agentdojo
            channel: tool_call
            count: 100

  phase1-standard-v2:
    seed: 42
    split: eval
    split_version: split-v2
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/phase1-standard-v2/p1.json
        target: 1740
        strata:
          - id: llmail_attack
            dataset: llmail
            expected_action: block
            count: 1580
          - id: llmail_benign
            dataset: llmail
            expected_action: allow
            count: all
        max_cluster_share: 0.01
      P2_tool_action:
        manifest: benchmarks/manifests/phase1-standard-v2/p2.json
        target: 540
        strata:
          - id: agentdojo_tool_call
            dataset: agentdojo
            channel: tool_call
            count: 540

  phase1-full-v2:
    seed: 42
    split: [eval, holdout]
    split_version: split-v2
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/phase1-full-v2/p1.json
        target: 2900
        strata:
          - id: llmail_attack
            dataset: llmail
            expected_action: block
            count: 2740
          - id: llmail_benign
            dataset: llmail
            expected_action: allow
            count: all
        max_cluster_share: 0.01
      P2_tool_action:
        manifest: benchmarks/manifests/phase1-full-v2/p2.json
        target: 773
        strata:
          - id: agentdojo_tool_call
            dataset: agentdojo
            channel: tool_call
            count: 773

  holdout-v2:
    seed: 42
    split: holdout
    split_version: split-v2
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/holdout-v2/p1.json
        target: 580
        strata:
          - id: llmail_attack
            dataset: llmail
            expected_action: block
            count: 500
          - id: llmail_benign
            dataset: llmail
            expected_action: allow
            count: all
        max_cluster_share: 0.01
      P2_tool_action:
        manifest: benchmarks/manifests/holdout-v2/p2.json
        target: 150
        strata:
          - id: agentdojo_tool_call
            dataset: agentdojo
            channel: tool_call
            count: 150

  # --- superseded v1 (preserved, not used for reporting) -------------------
  smoke-v1:
    seed: 42
    split: dev
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/smoke-v1/p1.json
        target: 100
      P2_tool_action:
        manifest: benchmarks/manifests/smoke-v1/p2.json
        target: 100

  phase1-standard-v1:
    seed: 42
    split: eval
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/phase1-standard-v1/p1.json
        target: 1740
      P2_tool_action:
        manifest: benchmarks/manifests/phase1-standard-v1/p2.json
        target: 540

  phase1-full-v1:
    seed: 42
    split: [eval, holdout]
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/phase1-full-v1/p1.json
        target: 2900
      P2_tool_action:
        manifest: benchmarks/manifests/phase1-full-v1/p2.json
        target: 800

  holdout-v1:
    seed: 42
    split: holdout
    projects:
      P1_external_instruction:
        manifest: benchmarks/manifests/holdout-v1/p1.json
        target: 580
      P2_tool_action:
        manifest: benchmarks/manifests/holdout-v1/p2.json
        target: 150
