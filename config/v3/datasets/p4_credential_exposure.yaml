# P4 Extended — deterministic seed-built credential exposure (Phase 2/10, P4E-v2)
# Source is derived from local seeds; no external fetch. The committed
# manifest lives under benchmarks/frozen/datasets/p4_credential_exposure/.
# Old dynamic P4 (credential_dynamic_traces) stays frozen but is NOT required
# for Extended benchmark: Standard/ Smoke no longer depend on it.

dataset_id: p4_credential_exposure

project: P4_credential_flow
track: extended  # explicit: never headline-eligible with synthetic-derived cases

quality:
  allowed: [C]

evidence_type: SEED_DERIVED
dynamic_confirmed: false

# Source is local deterministic seeds -> manifest; not an external clone
source:
  type: local
  revision: seeds-20260827-v2
  seeds: data/p4_extended/seeds/seeds.jsonl
  manifest: data/p4_extended/manifest.jsonl

channels:
  core: [tool_result]
  extended: [tool_result]

fidelity:
  tool_result: structured

canary:
  # P4E-v2: demo-scoped per-row marker (exact match), no shared TEST_SECRET_ tag
  mode: per_row_exact_match
  kinds: 10  # see src/demotest/datasets/p4_taxonomy.py + p4_canary.py
  seed: 20260827
  examples:
    - sk-proj-demo_<hex>
    - ghp_demo<hex>
    - xoxb-demo-<hex>
    - 123456:demo<hex>

taxonomy:
  subtypes: [P4_E1_DIRECT_SECRET, P4_E2_URL_COMMAND, P4_E3_EXCEPTION_LOG, P4_E4_STRUCTURED_DUMP, P4_E5_BENIGN_CONTROL]
  frozen: true
  benign_subtypes: [placeholder, redacted, name_only, schema, instruction, safe_log]

projection:
  channel: tool_result
  operation: read  # tool_result content
  direction: inbound
  project: P4_credential_flow
  expected_action: block  # per-row; E5 flips to allow

metadata:
  source_dataset: p4_extended
  quality_tier: C
  derivation: catalog_derived
  keep:
    - p4_subtype
    - benign_subtype
    - seed_id
    - secret_kind
    - group_id
    - source_case_id

# Freeze splits are group-aware by seed
split_group:
  group_id: seed_id
  format: "p4_extended:seed:{seed_id}"
  unknown: "p4_extended:seed:unknown"

# Allow rules are enforced by validator Phase 8 (placeholder/redacted/name-only etc)
# P4E-v2: ALLOW must not contain benchmark/gateway meta phrasing; content is
# world-realistic (env var ref, redacted log, schema, etc.)
allow_rules:
  no_complete_canary: true
  no_benchmark_gateway_meta: true
  categories: [placeholder, redacted, credential-name-only, instructional, schema-only, security-warning]
  complete_canary_must_block: true

note: Extended seed-derived only (Tier C, SEED_DERIVED, dynamic_confirmed false) — for P4 benchmark coverage independent of old dynamic P4.
