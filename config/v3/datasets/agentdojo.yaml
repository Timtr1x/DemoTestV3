# AgentDojo adapter config (guide §17-§29; v1.2.0, Phase 1.5).
#
# AgentDojo is an *executable* benchmark: ground truth (UserTask /
# InjectionTask / environment / ground-truth tool actions) lives in the
# suite/task code at the pinned commit. The adapter imports the official suite
# objects and projects them deterministically into SecurityCase — it does NOT
# regex-parse source, does NOT ask an LLM to (re)write attacks.
#
# Fix round P0-2: P1 tool_result from default injection vectors is REMOVED from
# core (it was environment content, not an attacker payload, and leaked the
# attacker goal into content). P1 is now LLMail-only. AgentDojo core is P2
# tool_call only (quality B, deterministic_projection).
#
# Phase 1.5 (v1.2.0): two ground-truth kinds from the SAME pinned benchmark.
#   injection_attack -> BLOCK  InjectionTask.ground_truth(env), filtered through
#                              the committed human review
#                              agentdojo_injection_gt_calls.json (fail-closed):
#                              attack-implementing calls stay BLOCK, preparatory
#                              read-only calls reviewed "exclude" are dropped.
#   user_authorized  -> ALLOW  UserTask.ground_truth(clean env) — the user's own
#                              authorized tool calls; never synthesized,
#                              rewritten, or template-expanded.

dataset_id: agentdojo

benchmark_version: v1

suites:
  - workspace
  - travel
  - banking
  - slack

# Projections — core only exposes tool_call (P2), both ground-truth kinds.
projections:
  tool_call:
    channel: tool_call
    operation: execute_tool
    direction: outbound
    project: P2_tool_action
    fields:
      user_intent: task_prompt
      tool_name: ground_truth_tool
      tool_arguments: ground_truth_arguments
    expected_action_by_kind:
      injection_attack: block
      user_authorized: allow

metadata:
  source_dataset: agentdojo
  quality_tier: B
  derivation: deterministic_projection
  keep:
    - source_task_id
    - source_security_case_id   # BLOCK side only (injection task id)
    - environment
    - user_task
    - attack                    # BLOCK side only
    - trajectory_step
    - derived_channel
    - parent_source_id
    - ground_truth_kind         # injection_attack | user_authorized

# Split grouping (Phase 1.5): BLOCK cases group by their UserTask x
# InjectionTask parent; ALLOW cases group by their UserTask
# (agentdojo:<suite>:user:<id>) so a multi-step authorized trajectory never
# spans splits. Both are produced via metadata.parent_source_id + provenance.
split_group:
  group_id: parent_source_id

# suite_targets removed — source of truth is config/v3/suites.yaml.
runtime:
  require_import: agentdojo.task_suite.load_suites
  inject_src_path: src
