# AgentDojo adapter config (guide §17-§29, fix round v1.1.0).
#
# AgentDojo is an *executable* benchmark: ground truth (UserTask /
# InjectionTask / environment / ground-truth tool actions) lives in the
# suite/task code at the pinned commit. The adapter imports the official suite
# objects and projects them deterministically into SecurityCase — it does NOT
# regex-parse source, does NOT ask an LLM to (re)write attacks.
#
# Fix round P0-2: P1 tool_result from default injection vectors is REMOVED from
# core (it was environment content, not an attacker payload, and leaked the
# attacker goal into content). P1 is now LLMail-only. AgentDojo core is P2
# tool_call only (quality B, deterministic_projection).

dataset_id: agentdojo

benchmark_version: v1

suites:
  - workspace
  - travel
  - banking
  - slack

# Projections — core only exposes tool_call (P2).
projections:
  tool_call:
    channel: tool_call
    operation: execute_tool
    direction: outbound
    project: P2_tool_action
    fields:
      user_intent: user_task_prompt
      tool_name: ground_truth_tool
      tool_arguments: ground_truth_arguments
    expected_action: block

metadata:
  source_dataset: agentdojo
  quality_tier: B
  derivation: deterministic_projection
  keep:
    - source_task_id
    - source_security_case_id
    - environment
    - user_task
    - attack
    - trajectory_step
    - derived_channel
    - parent_source_id

# Split grouping: tool_call cases from distinct parents are independent;
# group_id is parent_source_id so future tool_result+tool_call pairing stays together.
split_group:
  group_id: parent_source_id

# Per-suite selection targets (P2 tool_call only; P1 is LLMail).
suite_targets:
  smoke-v2:
    tool_call: 80
  phase1-standard-v2:
    tool_call: 540
  phase1-full-v2:
    tool_call: 773

runtime:
  require_import: agentdojo.task_suite.load_suites
  inject_src_path: src
