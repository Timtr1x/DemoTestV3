# P3 MCPTox Core adapter config (Phase 3C — 794 with 309 high-confidence clean).
#
# Source: zhiqiangwang4/MCPTox-Benchmark @ f85189f (UNRESOLVED license,
# REDISTRIBUTION NOT ASSUMED).  See docs/P3_MCPTox_SOURCE_AUDIT.md and
# docs/P3_MCPTox_CLEAN_AUDIT.md.
#
# BLOCK (485): pure_tool.json canonical definitions, one per def_tool/*.py.
#   server_name + tool_name + tool_content -> mcp_definition/REGISTER_TOOL/BLOCK
# ALLOW (309): response_all.json servers[*].clean_system_promot parsed strictly,
#   42 servers OK, 3 excluded (Apify/DoDo Payments/Email) as CLEAN_PARSE_AMBIGUOUS.
#   Each clean is exact source-span extraction (clean_system_promot[s:e] = raw
#   span) with outer-whitespace normalization (Gateway-visible = raw.strip(),
#   provenance raw_sha256=sha256(raw_span), normalized_sha256=sha256(stripped),
#   metadata source_span/source_span_sha256/projection_transform=strip_outer_whitespace).
#
# Both share group_id mcptox:server:<server_name> so BLOCK and ALLOW for the
# same MCP server stay together under any hash-bucketed split.

dataset_id: p3_mcptox

files:
  pure_tool:
    - pure_tool.json
  clean_prompts:
    - response_all.json
  def_tool:
    - def_tool/*.py

projection:
  channel: mcp_definition
  operation: register_tool
  direction: inbound
  project: P3_mcp_definition
  expected_action: block   # attack side; clean side flips to allow per-row
  content_source: mcp_tool_definition

metadata:
  source_dataset: mcptox
  quality_tier: B
  derivation: deterministic_projection
  keep:
    - server_name
    - tool_name
    - tool_address
    - security_risk
    - paradigm
    - query
    - group_id
    - source_case_id
    - ground_truth_kind
    - clean_prompt_sha256
    - source_span
    - source_span_sha256
    - projection_transform

# Leak-proofing: one MCP server never spans splits. Both BLOCK and ALLOW tools
# for the same server share the same group_id, so server-level hash bucketing
# (20/60/20 over 45 servers, seed 42) keeps them together pre-manifest.
split_group:
  group_id: server_name
  format: "mcptox:server:{server_name}"
  unknown: "mcptox:server:unknown"
