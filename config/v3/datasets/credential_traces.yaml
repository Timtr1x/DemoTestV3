# credential_traces — real CredentialTrace dataset -> P4 SecurityCase
# (Phase 2, guide §2 / §9-§13 / §53). This is the ONLY dataset that feeds
# P4_core. Traces come from gateway-visible flows (stdout -> TOOL_RESULT,
# network -> TOOL_CALL, plus benign ALLOW controls).

dataset_id: credential_traces

project: P4_credential_flow

quality:
  allowed:
    - A
    - B

# Core channels (guide §9-§13): TOOL_RESULT (stdout) + TOOL_CALL (network).
# OUTBOUND_RESPONSE is EXTENDED only (depends on response-side inspection).
channels:
  core:
    - tool_result
    - tool_call
  extended:
    - outbound_response

# Phase 2 fidelity (matches projects.yaml P4 primary_fidelity):
fidelity:
  tool_result: structured
  tool_call: structured
  outbound_response: raw

# Deterministic canary anchored on source revision + skill + issue + channel.
canary:
  prefix: TEST_SECRET_
  anchor: "source_revision|skill_id|issue_id|trace_channel"
  hash_len: 16

# Trace file the adapter reads (produced by the builder over skillleakbench).
trace:
  raw_file: cache/datasets_v3/raw/credential_traces/traces.jsonl
  metadata_file: cache/datasets_v3/raw/credential_traces/trace_meta.json

dedup:
  exact: true
  normalized: true
  near_duplicate:
    method: char_ngram_jaccard
    n: 5
    threshold: 0.85

# Grouping: entire Skill must share one split (Phase 2 stricter than AgentDojo).
# group_id = source_skill_id so a skill's stdout + network + benign controls
# never scatter across DEV/EVAL/HOLDOUT.
grouping:
  group_id: source_skill_id

# BLOCK vs ALLOW balance (guide §18-§20). P4 must not be all-BLOCK.
balance:
  target_allow_share: 0.30
  min_allow_share: 0.25

# Flow classes reported separately (guide §17/§47).
flow_classes:
  - STDOUT_EXPOSURE
  - NETWORK_EXFIL
  - AUTHORIZED_SECRET_USE
  - REDACTED_OUTPUT

# Visibility — direct vs projected (guide §16).
visibility:
  - DIRECT
  - PROJECTED
