# ASB memory-poisoning adapter config (Phase 2B — 420 with official controls).
#
# Source: agiresearch/ASB @ 1f561dcc… (ICLR 2025, arXiv 2410.02644, MIT).
# Attack projection (400 BLOCK): AttackerTool.get_tool_call_format() ->
#   [{"type":"function","function":{"name": <Attacker Tool>,
#                                   "description": <Description>}}]
# Normal projection (20 ALLOW): SimulatedTool.get_tool_call_format() ->
#   [{"type":"function","function":{"name": <Tool Name>,
#                                   "description": <Description>,
#                                   "parameters": null}}]   ← pinned null
# Attacker Instruction / Expected Achievements -> metadata only, never content.
# See src/demotest/datasets/adapters/asb_memory.py for the fidelity spec.

dataset_id: p5_asb_memory

files:
  attack_tools:
    - data/all_attack_tools.jsonl
  normal_tools:
    - data/all_normal_tools.jsonl

projection:
  channel: memory_write
  operation: write_memory
  direction: outbound
  project: P5_memory_write
  expected_action: block   # attack side; normal side flips to allow per-row
  content_source: attacker_tool_definition

metadata:
  source_dataset: asb
  quality_tier: B
  derivation: deterministic_projection
  keep:
    - attacker_tool
    - attack_type
    - aggressive
    - corresponding_agent
    - attacker_instruction
    - attack_goal
    - expected_achievements
    - source_field
    - ground_truth_kind
    - group_id

# Leak-proofing: one Corresponding Agent never spans splits. Both attack and
# normal tools for the same agent share the same group_id (asb:agent:<agent>),
# so group_aware_case_count_v2 keeps them together (DEV/EVAL/HOLDOUT intact).
split_group:
  group_id: corresponding_agent
  format: "asb:agent:{corresponding_agent}"
  unknown: "asb:agent:unknown"
