# credential_catalog_synthetic — catalog-derived Extended synthetic (quality C)
# Downgraded per validity fix P0-1..P0-6: offline synthesis, not real sandbox trace.
# Never counted as P4 Core (Core requires DYNAMIC_TRACE quality A/B).

dataset_id: credential_catalog_synthetic

project: P4_credential_flow

quality:
  allowed:
    - C

evidence_type: CATALOG_DERIVED
dynamic_confirmed: false

channels:
  core:
    - tool_result
    - tool_call
  extended:
    - outbound_response

fidelity:
  tool_result: structured
  tool_call: structured
  outbound_response: raw

canary:
  prefix: TEST_SECRET_
  anchor: "source_revision|skill_id|issue_id|trace_channel"
  hash_len: 16

trace:
  raw_file: cache/datasets_v3/raw/credential_catalog_synthetic/traces.jsonl
  metadata_file: cache/datasets_v3/raw/credential_catalog_synthetic/trace_meta.json

# P0-4: only gateway-visible patterns produce traces (Information Exposure,
# Data Exfiltration, Credential Compromise, Remote Exploitation). Hardcoded etc
# remain catalog-only until a real dynamic trace proves a gate-visible flow.
gateway_visible_only: true

# P0-5: neutral payloads (no attacker/exfil keyword leakage)
neutral_payloads: true

dedup:
  exact: true
  normalized: true
  near_duplicate:
    method: char_ngram_jaccard
    n: 5
    threshold: 0.85

grouping:
  group_id: source_skill_id

balance:
  target_allow_share: 0.30
  min_allow_share: 0.25

flow_classes:
  - STDOUT_EXPOSURE
  - NETWORK_EXFIL
  - AUTHORIZED_SECRET_USE
  - REDACTED_OUTPUT

visibility:
  - DIRECT
  - PROJECTED

note: Extended synthetic only (Tier C, CATALOG_DERIVED, dynamic_confirmed false) — for regression/renderer/oracle validation, not headline benchmark.
