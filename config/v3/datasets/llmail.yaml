# LLMail-Inject adapter config (guide §3-§16, fix round v1.1.0).
#
# Source of truth for fields: the official labelled_unique_submissions files
# already aggregate near-duplicate attacker submissions and carry labels
# (attack_attempt / reason / judge_category). The adapter is a DETERMINISTIC
# projection: raw row -> SecurityCase. It MUST NOT rewrite, translate, or
# augment payloads (guide §11, §52).

dataset_id: llmail

# Bounded pool for default prepare (guide P0-1): true O(K) Top-K via
# BoundedHashSelector. Only this many attacks are materialized.
bounded_pool:
  total_attack: 3700
  phases:
    phase1: 3145
    phase2: 555

# Files the adapter reads (relative to raw_dir). The FP emails are benign.
files:
  attack:
    - data/labelled_unique_submissions_phase1.json
    - data/labelled_unique_submissions_phase2.json
  benign:
    - data/emails_for_fp_tests.json
  context:
    - data/scenarios.json
    - data/levels_descriptions.json
    - data/objectives_descriptions.json
    - data/system_prompt.json

# SecurityCase projection
projection:
  channel: email
  operation: read
  direction: inbound
  project: P1_external_instruction
  content_field: prompt
  expected_action:
    attack: block
    benign: allow

# Metadata preserved per case.
# Phase 1.5 honesty pass: this list names ONLY the fields the adapter actually
# emits, with their provenance. The official labelled_unique_submissions files
# carry exactly {attack_attempt, reason} per prompt — anything else (scenario,
# style, goal) is framework-derived and marked as such below.
metadata:
  source_dataset: llmail
  quality_tier: A
  derivation: original
  keep:
    - source_phase      # official: file origin (phase1 | phase2 | benign)
    - original_label    # official: raw attack_attempt value, verbatim
    - label_source      # official: raw reason (api_triggered | judge | benign_fp)
    - scenario          # APPROXIMATE: content-marker heuristic, NOT official
    - attack_goal       # FRAMEWORK classification (constant), NOT official
  status:
    scenario: approximate_content_marker_heuristic
    presentation_style: heuristic
    attack_goal: framework_classification_constant_not_official
    team_id: unavailable_without_full_submissions_join
    original_success: unavailable_without_full_submissions_join

# Quality / dedup (guide §12-§16)
dedup:
  exact: true
  normalized: true
  near_duplicate:
    method: char_ngram_jaccard
    n: 5
    threshold: 0.85

stratification:
  # Phase 1.5: attack_goal removed (constant "exfiltrate_via_email" — zero
  # information) and original_success removed (never emitted; not present in
  # the pinned labelled_unique files). scenario is kept but is an APPROXIMATE
  # content-marker heuristic, not official metadata.
  keys:
    - source_phase
    - scenario
    - near_dup_cluster_id
  caps:
    max_team_share: null   # team_id unavailable without full submissions join
    max_cluster_share: 0.01
    status:
      team_stratification: unavailable_without_raw_submission_join
      attack_goal_stratification: removed_constant_framework_value
      success_stratification: unavailable_without_full_submissions_join

# Split grouping (guide §22): near-duplicate attacks must share a split.
split_group:
  group_id: near_dup_cluster_id

# suite_targets removed — source of truth is config/v3/suites.yaml (fix round).
# Dataset YAML owns source/cleaning/quality; suite YAML owns quotas.
