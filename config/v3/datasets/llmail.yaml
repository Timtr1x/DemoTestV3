# LLMail-Inject adapter config (guide §3-§16, fix round v1.1.0).
#
# Source of truth for fields: the official labelled_unique_submissions files
# already aggregate near-duplicate attacker submissions and carry labels
# (attack_attempt / reason / judge_category). The adapter is a DETERMINISTIC
# projection: raw row -> SecurityCase. It MUST NOT rewrite, translate, or
# augment payloads (guide §11, §52).

dataset_id: llmail

# Bounded pool for default prepare (guide P0-1): true O(K) Top-K via
# BoundedHashSelector. Only this many attacks are materialized.
bounded_pool:
  total_attack: 3700
  phases:
    phase1: 3145
    phase2: 555

# Files the adapter reads (relative to raw_dir). The FP emails are benign.
files:
  attack:
    - data/labelled_unique_submissions_phase1.json
    - data/labelled_unique_submissions_phase2.json
  benign:
    - data/emails_for_fp_tests.json
  context:
    - data/scenarios.json
    - data/levels_descriptions.json
    - data/objectives_descriptions.json
    - data/system_prompt.json

# SecurityCase projection
projection:
  channel: email
  operation: read
  direction: inbound
  project: P1_external_instruction
  content_field: prompt
  expected_action:
    attack: block
    benign: allow

# Metadata preserved per case
metadata:
  source_dataset: llmail
  quality_tier: A
  derivation: original
  keep:
    - source_phase
    - team_id
    - scenario
    - attack_goal
    - original_label
    - original_success
    - label_source
    - judge_category

# Quality / dedup (guide §12-§16)
dedup:
  exact: true
  normalized: true
  near_duplicate:
    method: char_ngram_jaccard
    n: 5
    threshold: 0.85

stratification:
  keys:
    - source_phase
    - scenario
    - attack_goal
    - original_success
    - near_dup_cluster_id
  caps:
    max_team_share: null   # team_id unavailable without raw submission join (fix round)
    max_cluster_share: 0.01
    status:
      team_stratification: unavailable_without_raw_submission_join

# Split grouping (guide §22): near-duplicate attacks must share a split.
split_group:
  group_id: near_dup_cluster_id

# suite_targets removed — source of truth is config/v3/suites.yaml (fix round).
# Dataset YAML owns source/cleaning/quality; suite YAML owns quotas.
