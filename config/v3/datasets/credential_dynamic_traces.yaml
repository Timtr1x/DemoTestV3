# P4 Core — dynamic credential traces (real sandbox evidence, guide P4 §15/§16)
# This is the ONLY P4 Core dataset. Synthetic catalog data lives in
# credential_catalog_synthetic (Extended / quality C) and never mixes here.
dataset_id: credential_dynamic_traces
project: P4_credential_flow
track: core  # headline-eligible ONLY after Trace Validity acceptance (§28/§29)

quality:
  allowed: [A, B]
  # stdout DIRECT  -> A / original
  # network PROJECTED -> B / deterministic_projection
evidence_type: DYNAMIC_TRACE
dynamic_confirmed: true

source:
  sandbox_provider: SkillLeakBench
  pipeline_dataset: skillleakbench_pipeline  # pinned github clone + source lock
  # PUBLISHING BRIDGE: formal input is the human-frozen reviewed artifact, not
  # the ephemeral sandbox traces.jsonl. Reviewed traces + meta are COMMITTED
  # under benchmarks/frozen/datasets/credential_dynamic_traces/raw/reviews/,
  # so a normal benchmark run requires no Docker / SkillsMP / SkillLeakBench.
  raw_file: benchmarks/frozen/datasets/credential_dynamic_traces/raw/reviews/reviewed_traces.jsonl
  meta_file: benchmarks/frozen/datasets/credential_dynamic_traces/raw/reviews/review_meta.json
  executions_audit: cache/datasets_v3/raw/credential_dynamic_traces/executions.jsonl

channels:
  core: [tool_result, tool_call]  # stdout -> tool_result; network -> tool_call
fidelity:
  tool_result: structured
  tool_call: structured

canary:
  # Deterministic fake credentials ONLY — materialized after human review via
  # the credential_bindings sidecar (source-bound-v1 profile). Values are
  # canaries, never real secrets:
  #   * source-bound profile: leakbench-sourcebound-<sha12(candidate_id|source_sha256)>-<sha12(credential_name)>
  #   * official-baseline profile: the official forged 9-name namespace
  #     (OPENAI_API_KEY / AWS_* / DATABASE_URL / ...), fake values only
  # Credential NAMES come from the CONFIRMED bindings (real env-var names the
  # skill actually reads); the old fixed TEST_SECRET_<HEX16> catalog shorthand
  # is superseded by the sidecar schemas in datasets/dynamic/credential_bindings.py.
  # (See docs/PROJECT_SCOPE.md §3 — no credential-format DSL is introduced.)

trace:
  # trace_hash covers the full canonical event (snapshot sha, condition, marker,
  # sink, payload, destination, image digest, pipeline revision) — never just IDs
  stdout_excerpt_window: 1024  # deterministic ±N chars around marker
  destination_rewrite: forbidden  # observed_destination kept verbatim
  destination_classes: [sandbox_sinkhole, expected_provider, unexpected_external]

execution:
  # only SUCCESS_* outcomes may enter the dataset; crash/timeout/dependency
  # failures are UNRESOLVED_EXECUTION and excluded (never benign controls)
  eligible_outcomes: [SUCCESS_REACHED_SECRET_PATH, SUCCESS_NO_SECRET_FLOW]
  modes_v1: [deterministic]  # agent_driven (T4) deferred to Core v1.1

grouping:
  group_id: source_skill_id  # skill-level split; stdout+network of one skill stay together

acceptance_gate: p4-dynamic-dev-v1 must pass human trace review before any
  p4-core-smoke-v1 / standard / full / holdout manifest is frozen (§27/§28)
